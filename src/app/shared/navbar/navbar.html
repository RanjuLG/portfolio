<!-- Top Navigation Bar -->
<nav class="top-navbar">
  <div class="navbar-container">
    

    <!-- Navigation Links - Centered -->
    <ul class="nav-links">
      <li>
        <a
          routerLink="/"
          fragment="home"
          [class.active]="activeSection() === 'home'"
          (click)="closeMenu()"
        >
          <span>Home</span>
        </a>
      </li>
      <li>
        <a
          routerLink="/"
          fragment="about"
          [class.active]="activeSection() === 'about'"
          (click)="closeMenu()"
        >
          <span>About</span>
        </a>
      </li>
      <li>
        <a
          routerLink="/"
          fragment="projects"
          [class.active]="activeSection() === 'projects'"
          (click)="closeMenu()"
        >
          <span>Projects</span>
        </a>
      </li>
      <li>
        <a
          routerLink="/"
          fragment="contact"
          [class.active]="activeSection() === 'contact'"
          (click)="closeMenu()"
        >
          <span>Contact</span>
        </a>
      </li>
      <li>
        <a routerLink="/blog" [class.active]="activeSection() === 'blog'" (click)="closeMenu()">
          <span>Blog</span>
        </a>
      </li>
    </ul>

    <!-- Theme Toggle - Right Aligned -->
    <div class="navbar-actions">
      <button
        class="theme-toggle"
        (click)="toggleTheme()"
        [attr.aria-label]="
          themeService.currentTheme() === 'light' ? 'Switch to dark mode' : 'Switch to light mode'
        "
      >
        <span class="theme-toggle-track">
          <span class="theme-toggle-thumb">
            <!-- Sun Icon (Light Mode) -->
            <svg
              *ngIf="themeService.currentTheme() === 'light'"
              class="theme-icon sun-icon"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <circle cx="12" cy="12" r="5" fill="currentColor" />
              <path
                d="M12 1V3M12 21V23M4.22 4.22L5.64 5.64M18.36 18.36L19.78 19.78M1 12H3M21 12H23M4.22 19.78L5.64 18.36M18.36 5.64L19.78 4.22"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
            </svg>
            <!-- Moon Icon (Dark Mode) -->
            <svg
              *ngIf="themeService.currentTheme() === 'dark'"
              class="theme-icon moon-icon"
              viewBox="0 0 24 24"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="currentColor" />
            </svg>
          </span>
        </span>
      </button>

      <!-- Mobile Menu Toggle -->
      <button
        class="mobile-toggle"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen()"
        aria-label="Toggle navigation menu"
      >
        <span class="hamburger" [class.active]="isMenuOpen()">
          <span></span>
          <span></span>
          <span></span>
        </span>
      </button>
    </div>
  </div>

  <!-- Mobile Menu -->
  <div class="mobile-menu" [class.open]="isMenuOpen()">
    <ul class="mobile-nav-links">
      <li>
        <a
          routerLink="/"
          fragment="home"
          [class.active]="activeSection() === 'home'"
          (click)="closeMenu()"
        >
          Home
        </a>
      </li>
      <li>
        <a
          routerLink="/"
          fragment="about"
          [class.active]="activeSection() === 'about'"
          (click)="closeMenu()"
        >
          About
        </a>
      </li>
      <li>
        <a
          routerLink="/"
          fragment="projects"
          [class.active]="activeSection() === 'projects'"
          (click)="closeMenu()"
        >
          Projects
        </a>
      </li>
      <li>
        <a
          routerLink="/"
          fragment="contact"
          [class.active]="activeSection() === 'contact'"
          (click)="closeMenu()"
        >
          Contact
        </a>
      </li>
      <li>
        <a routerLink="/blog" [class.active]="activeSection() === 'blog'" (click)="closeMenu()">
          Blog
        </a>
      </li>
    </ul>
  </div>
</nav>

<!-- Overlay for mobile -->
<div class="navbar-overlay" [class.active]="isMenuOpen()" (click)="closeMenu()"></div>
