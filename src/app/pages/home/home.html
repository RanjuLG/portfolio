<div class="home">
  <!-- Hero Section -->
  <section class="hero section">
    <div class="hero-glow"></div>
    <div class="container">
      <div class="hero-content centered-hero">
        <div class="hero-text" data-aos="fade-up">
          @if (config.availability.status) {
          <a routerLink="/" fragment="contact" class="hero-badge glass-pill">
            <span class="hero-badge-dot pulse"></span>
            {{ config.availability.title }}
          </a>
          }

          <!-- Primary Identity -->
          <div class="hero-identity">
            <h1 class="hero-name gradient-text">{{ config.personal.name }}</h1>
            <h2 class="hero-role">{{ config.personal.role }}</h2>
          </div>

          <!-- Description -->
          <p class="hero-tagline">{{ tagline }}</p>

          <!-- Call to Actions -->
          <div class="hero-actions">
            <a routerLink="/projects" class="btn btn-primary">
              View Projects
            </a>
            <a routerLink="/blog" class="btn btn-secondary">
              Read My Blog
            </a>
          </div>

          <!-- Credentials / Tech Stack -->

          <!-- Social Connections -->
          <div class="hero-social">
            <div class="social-links-hero">
              @for (link of socialLinks; track link.name) {
              <a
                [href]="link.url"
                target="_blank"
                rel="noopener noreferrer"
                [attr.aria-label]="link.name"
                class="social-link"
              >
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" class="social-icon">
                  <path [attr.d]="link.icon" fill="currentColor" />
                </svg>
              </a>
              }
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</div>
